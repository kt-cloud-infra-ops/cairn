# .cairn/workspace.yaml
# Cairn workspace identity and configuration.
# Generated by: cairn init
# Schema: cairn.workspace/v1

schema: "cairn.workspace/v1"

workspace:
  name: "<YOUR_WORKSPACE_NAME>"          # 예: "pe-workspace"
  mode: "multi-project"                  # multi-project | solo | project-local
  created_by: "cairn-init"
  default_project_root: "projects"

profile:
  name: "<YOUR_PROFILE_NAME>"            # 예: "cairn-pe"
  path: ".cairn/profile"
  schema: "cairn.profile/v1"

storage:
  knowledge: "knowledge"
  decisions: "decisions"
  runbooks: "runbooks"
  services: "services"
  support_projects: "support-projects"

# Mode 설명:
#
# multi-project (권장):
#   여러 서비스 repo를 sources.yaml로 관리.
#   projects/ 하위에 clone/pull. capture target이 workspace storage에 고정.
#
# solo:
#   혼자 단일 workspace 운영. profile optional.
#   Atlassian/CI 연동은 선택.
#
# project-local (제한):
#   단일 코드 repo 내부에서 제한적으로 실행.
#   clone/pull 관리, workspace-level capture 불가.
#   진입 시 workspace 생성을 권장하는 안내가 표시됨.
