# .cairn/sources.yaml
# Managed project clone/pull registry.
# Cairn reads this file to clone and update projects under projects/.
# Schema: cairn.sources/v1

schema: "cairn.sources/v1"

defaults:
  root: "projects"            # 기본 clone root 폴더
  pull_policy: "manual"       # manual | auto | on-start | scheduled
  dirty_policy: "skip"        # skip | stash | fail
  clone_depth: 1              # shallow clone 깊이. 0 = full clone

sources:
  # --- 서비스 repo 예시 ---
  - name: "service-a"
    role: "service"           # service | domain | docs | wiki | support | platform
    repo: "git@github.com:<YOUR_ORG>/service-a.git"
    ref:
      type: "branch"          # branch | tag | commit
      name: "develop"
    path: "projects/service-a"
    profile_service_key: "service-a"    # profile/services.yaml의 service key
    pull:
      policy: "manual"        # 이 source만 다른 정책 적용 가능
      rebase: false
      prune: true
    docs:
      project_docs: "docs"    # repo 내 docs 경로
      wiki_repo: "git@github.com:<YOUR_ORG>/service-a.wiki.git"
    tags: ["backend", "critical"]

  # --- docs 전용 repo 예시 ---
  - name: "platform-docs"
    role: "docs"
    repo: "git@github.com:<YOUR_ORG>/platform-docs.git"
    ref:
      type: "branch"
      name: "main"
    path: "projects/platform-docs"
    pull:
      policy: "on-start"      # workspace 시작 시 자동 pull

  # --- 지원 프로젝트 예시 ---
  # - name: "support-project-x"
  #   role: "support"
  #   repo: "git@github.com:<YOUR_ORG>/support-x.git"
  #   ref:
  #     type: "branch"
  #     name: "main"
  #   path: "projects/support-project-x"
  #   tags: ["external", "review-only"]

# 필드 정의:
#
# sources[].name            — workspace 내 source id. kebab-case 필수
# sources[].role            — service/domain/docs/wiki/support/platform
# sources[].repo            — git URL. secret(token 등) 포함 금지
# sources[].ref.type/name   — branch/tag/commit
# sources[].path            — workspace 상대 경로. '..' 금지
# sources[].profile_service_key — profile/services.yaml의 service key (role:service 권장)
# sources[].pull.policy     — manual/auto/on-start/scheduled
# sources[].pull.rebase     — pull 시 rebase 여부
# sources[].docs            — project_docs: docs 경로, wiki_repo: wiki git URL
# sources[].tags            — 검색/필터용 임의 태그
#
# 검증 규칙:
# - path는 workspace 내부 상대 경로 (.. 탐색 금지)
# - 같은 name/path 중복 금지
# - role:service는 가능하면 profile_service_key 포함
# - strategy:link (symlink)는 기본값이 아닌 advanced 옵션으로만 허용
